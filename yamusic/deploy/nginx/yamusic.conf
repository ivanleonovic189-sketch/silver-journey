# Nginx внутри VM: TLS + реверс-прокси на Node.
# HTTPS нужен, чтобы PWA ставилась на телефон и работал service worker.
#
# Установка (в VM):
#   sudo cp yamusic.conf /etc/nginx/conf.d/yamusic.conf
#   sudo certbot --nginx -d music.example.com     # либо самоподписанный сертификат
#   sudo systemctl enable --now nginx

server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    # Оставьте, если получаете сертификат через certbot webroot
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music.example.com;

    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Аудио отдаётся потоком, тела ответов большие
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # Поток и обложки: без буферизации, с длинными таймаутами и поддержкой Range
    location ~ ^/api/(stream|cover) {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
